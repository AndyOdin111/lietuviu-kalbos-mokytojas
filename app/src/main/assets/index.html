<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF4F8">
<title>Lietuvių kalbos mokytojas</title>
<style>
:root{
  --bg:#FFF4F8;--bg2:#FFE9F1;--card:#FFFFFF;--fg:#3B2F4A;--mut:#8C7FA0;--line:#F2DDE8;
  --pink:#FF7EB6;--pink2:#FF5FA2;--pinkS:#FFE0EE;--lav:#9B8CFF;--lavS:#ECE8FF;
  --mint:#3EC9A0;--mintS:#DDF7EE;--sun:#FFB84D;--sunS:#FFF0D6;--red:#FF6B7A;--redS:#FFE3E6;
  --sh:0 6px 20px rgba(155,100,160,.14);--sh2:0 3px 0 rgba(155,100,160,.18);
  --r:24px;
}
:root[data-theme=dark]{
  --bg:#1D1830;--bg2:#272040;--card:#2C2547;--fg:#F4EEFF;--mut:#A99CC8;--line:#3C3360;
  --pink:#FF86BE;--pink2:#FF6AAE;--pinkS:#4A2C48;--lav:#A99CFF;--lavS:#3A3366;
  --mint:#4FD8AF;--mintS:#1F4140;--sun:#FFC468;--sunS:#4A3B28;--red:#FF7C8A;--redS:#4B2A38;
  --sh:0 6px 20px rgba(0,0,0,.35);--sh2:0 3px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);
  font-family:"Nunito","Quicksand","Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#root{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
#app{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.view{animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
h2{font-size:19px;font-weight:900;margin:22px 4px 10px}
.sub{color:var(--mut);font-size:14px;font-weight:600;margin-top:4px;line-height:1.35}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mut{color:var(--mut)}
.center{text-align:center}

/* header / mascot */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mascot{width:74px;height:74px;border-radius:50%;background:linear-gradient(145deg,var(--pinkS),var(--lavS));
  display:grid;place-items:center;font-size:44px;box-shadow:var(--sh);flex:none;animation:bounce 3s ease-in-out infinite}
.back{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:20px;color:var(--fg);flex:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}

/* buttons */
.btn{border:0;border-radius:20px;padding:15px 20px;font:inherit;font-weight:800;font-size:16px;color:#fff;
  background:var(--pink);box-shadow:0 4px 0 var(--pink2);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink2)}
.btn.lav{background:var(--lav);box-shadow:0 4px 0 #7D6EEA}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #2BA583}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #E39A2E}
.btn.soft{background:var(--pinkS);color:var(--pink2);box-shadow:0 4px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:16px;width:auto}
.btn[disabled]{opacity:.5}
.btn.danger{background:var(--redS);color:var(--red);box-shadow:0 4px 0 var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--lavS);font-size:21px;flex:none}
.icon-btn:active{transform:scale(.92)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 10px;text-align:center;border-radius:20px;background:var(--card);box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;font-weight:900;margin-top:2px}
.stat span{font-size:11.5px;color:var(--mut);font-weight:700}
.stat .em{font-size:22px}
.bar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .5s}
.bar.g i{background:linear-gradient(90deg,var(--mint),#7BE3C5)}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px;text-align:center;line-height:1.05}
.ring small{display:block;font-size:10px;color:var(--mut);font-weight:700}

/* modes */
.mode{border:0;border-radius:22px;padding:16px 10px;text-align:center;font:inherit;font-weight:800;font-size:15px;color:var(--fg);
  box-shadow:var(--sh2),var(--sh);transition:transform .1s}
.mode:active{transform:scale(.95)}
.mode .e{font-size:34px;display:block;margin-bottom:4px}
.mode small{display:block;font-weight:600;color:var(--mut);font-size:12px;margin-top:2px}
.m1{background:var(--pinkS)}.m2{background:var(--lavS)}.m3{background:var(--mintS)}.m4{background:var(--sunS)}

/* topics */
.topic{display:flex;align-items:center;gap:12px;padding:13px;border-radius:22px;background:var(--card);box-shadow:var(--sh);margin-bottom:10px;border:0;width:100%;text-align:left;font:inherit;color:var(--fg)}
.topic:active{transform:scale(.98)}
.topic .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:27px;flex:none}
.topic b{font-size:15.5px;font-weight:800;display:block}
.topic small{color:var(--mut);font-weight:700;font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:99px;padding:9px 15px;font:inherit;font-weight:800;font-size:14px;background:var(--card);color:var(--mut);box-shadow:var(--sh);white-space:nowrap}
.chip.on{background:var(--pink);color:#fff}

/* session */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog .bar{flex:1}
.prog span{font-weight:800;color:var(--mut);font-size:13px}
.flip{perspective:1000px;height:min(52vh,380px);margin-bottom:14px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--sh);gap:10px}
.face.f{background:linear-gradient(160deg,var(--card),var(--pinkS))}
.face.b{background:linear-gradient(160deg,var(--card),var(--lavS));transform:rotateY(180deg)}
.big{font-size:34px;font-weight:900;line-height:1.15;word-break:break-word}
.tr{color:var(--lav);font-weight:800;font-size:17px}
.hint{font-size:13px;color:var(--mut);font-weight:700}
.fav{position:absolute;top:12px;right:14px;border:0;background:none;font-size:28px;color:var(--sun)}
.qcard{text-align:center;padding:20px 16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:15px 16px;
  font:inherit;font-weight:800;font-size:16.5px;color:var(--fg);margin-bottom:10px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--mintS);border-color:var(--mint);color:var(--mint)}
.opt.bad{background:var(--redS);border-color:var(--red);color:var(--red);animation:shake .35s}
.opt[disabled]{pointer-events:none}
.fb{min-height:28px;text-align:center;font-weight:900;font-size:16px;margin:2px 0 10px}
.in-text{width:100%;border:3px solid var(--line);border-radius:20px;background:var(--card);color:var(--fg);padding:14px;font:inherit;font-size:22px;font-weight:800;text-align:center;outline:none}
.in-text:focus{border-color:var(--pink)}
.in-text.ok{border-color:var(--mint)}.in-text.bad{border-color:var(--red)}
.hintline{font-size:22px;letter-spacing:2px;color:var(--pink2);font-weight:900;min-height:30px;word-break:break-all}
.btnrow{display:flex;gap:10px;margin-top:12px}
.btnrow .btn{flex:1;padding:13px 8px;font-size:15px}

/* list */
.search{width:100%;border:0;border-radius:20px;padding:14px 18px;font:inherit;font-size:16px;font-weight:700;background:var(--card);color:var(--fg);box-shadow:var(--sh);outline:none;margin-bottom:10px}
.word{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:18px;margin-bottom:8px;box-shadow:var(--sh)}
.word b{font-weight:800;font-size:16px;display:block}
.word small{color:var(--mut);font-weight:700;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.l{background:var(--mint)}.dot.p{background:var(--sun)}
.wbtn{border:0;background:none;font-size:22px;padding:6px;color:var(--sun)}
.wbtn.sp{color:var(--lav)}

/* result */
.pct{font-size:60px;font-weight:900;line-height:1}
.mist{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:700;font-size:14.5px}
.confetti{position:fixed;top:-30px;font-size:24px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:50}

/* settings */
.set{margin-bottom:12px}
.set b{font-weight:900;font-size:16px}
.set .sub{margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;font-size:14px;background:var(--bg2);color:var(--mut)}
.seg button.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink2)}

/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;position:relative}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;font-weight:800;color:var(--mut)}
.col i{display:block;width:100%;max-width:34px;border-radius:12px 12px 6px 6px;background:var(--lavS);min-height:6px;transition:height .5s}
.col.today i{background:linear-gradient(180deg,var(--pink),var(--lav))}

/* nav */
nav{display:flex;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 22px rgba(155,100,160,.14);padding:8px 8px 10px;flex:none}
nav button{flex:1;border:0;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-weight:800;font-size:11px;border-radius:18px;transition:.15s}
nav button span{font-size:23px;transition:transform .2s;filter:grayscale(.7);opacity:.75}
nav button.on{color:var(--pink2);background:var(--pinkS)}
nav button.on span{transform:translateY(-2px) scale(1.12);filter:none;opacity:1}
.empty{padding:30px 16px;text-align:center}
.empty .e{font-size:52px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div id="root">
  <main id="app"></main>
  <nav id="nav"></nav>
</div>

<script>
"use strict";
/* ---------- data ---------- */
const TOPICS = DATA.map((t,i)=>({i:t.i,n:t.n,w:t.w.map(x=>({en:x[0],ru:x[1],tr:x[2],t:i}))}));
const WORDS = TOPICS.flatMap(t=>t.w);
const TCOL = ['var(--pinkS)','var(--lavS)','var(--mintS)','var(--sunS)'];
const INTERVALS=[0,1,2,4,8,16];
const DEF={theme:'light',sound:true,speed:'normal',session:10,goal:20};
const KEY='lithuanian_trainer_progress_v1';

/* ---------- storage ---------- */
const store=(()=>{
  let d={words:{},days:{},fav:[],settings:{...DEF}};
  try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){d.words=j.words||{};d.days=j.days||{};d.fav=j.fav||[];d.settings={...DEF,...(j.settings||{})}}}catch(e){}
  const fav=new Set(d.fav);
  const today=()=>{const x=new Date();return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  const addDays=(n)=>{const x=new Date();x.setDate(x.getDate()+n);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({words:d.words,days:d.days,fav:[...fav],settings:d.settings}))}catch(e){}};
  return{
    s:d.settings,today,save,fav,
    box:en=>(d.words[en]||{}).b||0,
    learned(en){return this.box(en)>=3},
    seen:en=>en in d.words,
    due:en=>{const w=d.words[en];return !!w&&w.due<=today()},
    record(en,ok){
      const w=d.words[en]||(d.words[en]={b:0,n:0,c:0,due:today()});
      w.n++; if(ok){w.c++;w.b=Math.min(w.b+1,5)}else w.b=Math.max(w.b-2,0);
      w.due=addDays(INTERVALS[w.b]); d.days[today()]=(d.days[today()]||0)+1; save();
    },
    toggleFav(en){fav.has(en)?fav.delete(en):fav.add(en);save()},
    todayCount:()=>d.days[today()]||0,
    dayCount:k=>d.days[k]||0,
    streak(){let n=0;const x=new Date();const key=()=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
      if(!d.days[key()])x.setDate(x.getDate()-1);
      while(d.days[key()]){n++;x.setDate(x.getDate()-1)}return n},
    accuracy(){let n=0,c=0;for(const k in d.words){n+=d.words[k].n;c+=d.words[k].c}return n?Math.floor(100*c/n):0},
    reset(){d.words={};d.days={};save()},
    dayKey(off){const x=new Date();x.setDate(x.getDate()-off);return[new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),x.getDay()]}
  };
})();

/* ---------- speech ---------- */
const RATE={slow:.7,normal:.92,fast:1.2};
function say(text,force){
  if(!(store.s.sound||force))return;
  text=String(text).replace(/’/g,"'").replace(/\.\.\./g,'').replace(/\|/g,' ').trim(); if(!text)return;
  try{
    if(window.Android&&Android.speak){Android.speak(text,RATE[store.s.speed]||.92);return}
    if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='lt-LT';u.rate=RATE[store.s.speed];speechSynthesis.speak(u)}
  }catch(e){}
}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let timers=[];const later=(ms,f)=>{const t=setTimeout(f,ms);timers.push(t)};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};

/* ---------- state ---------- */
let view='home',args={},sel={k:'all'},stack=[],override=null;
const MODES={cards:['🎴','Kortelės','Vartyk ir įsimink'],quiz:['🧩','Testas','Pasirink vertimą'],write:['✍️','Rašymas','Parašyk žodį'],listen:['🎧','Klausymas','Atpažink iš klausos']};
const TABS=[['home','🏠','Pradžia'],['learn','🎓','Mokytis'],['dict','📖','Žodynas'],['stats','📊','Pažanga'],['settings','⚙️','Daugiau']];
const dueList=()=>WORDS.filter(w=>store.due(w.en));
function selWords(){
  if(sel.k==='topic')return TOPICS[sel.v].w;
  if(sel.k==='due')return dueList();
  if(sel.k==='fav')return WORDS.filter(w=>store.fav.has(w.en));
  return WORDS;
}
function selName(){
  if(sel.k==='topic')return TOPICS[sel.v].i+' '+TOPICS[sel.v].n;
  return{all:'Visos temos',due:'Kartojimas',fav:'Mėgstamiausi'}[sel.k];
}
function pickWords(){
  if(override){const w=shuffle([...override]);override=null;return w}
  const pool=selWords();
  const due=shuffle(pool.filter(w=>store.due(w.en)));
  const nw=shuffle(pool.filter(w=>!store.seen(w.en)));
  const rest=shuffle(pool.filter(w=>store.seen(w.en)&&!store.due(w.en)));
  return shuffle([...due,...nw,...rest].slice(0,store.s.session));
}
function distractors(w,toRu,n=3){
  const key=toRu?'ru':'en';
  const isPh=x=>x.en.trim().includes(' ')&&!x.en.startsWith('to ');
  const ok=x=>x.en!==w.en&&x.ru.toLowerCase()!==w.ru.toLowerCase()&&isPh(x)===isPh(w);
  const same=shuffle(TOPICS[w.t].w.filter(ok)),other=shuffle(WORDS.filter(x=>x.t!==w.t&&ok(x)));
  const res=[],seen=new Set([w[key].toLowerCase()]);
  for(const x of [...same.slice(0,n*2),...other]){
    if(!seen.has(x[key].toLowerCase())){seen.add(x[key].toLowerCase());res.push(x[key])}
    if(res.length===n)break;
  }
  return res;
}

/* ---------- navigation ---------- */
function go(v,a={},push=true){
  clearTimers();
  if(push&&view!==v||(push&&view===v&&JSON.stringify(a)!==JSON.stringify(args)))stack.push({view,args,sel:{...sel}});
  view=v;args=a;render();
}
function goTab(v){clearTimers();stack=[];view=v;args={};render()}
window.__back=function(){
  clearTimers();
  const p=stack.pop();
  if(p){view=p.view;args=p.args;sel=p.sel;render();return true}
  if(view!=='home'){view='home';args={};render();return true}
  return false;
};
function render(){
  const app=$('#app');
  const tab=['home','learn','dict','stats','settings'].includes(view)?view:(['topic','cards','quiz','write','listen','result'].includes(view)?'learn':view);
  $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${t[0]===tab?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  app.scrollTop=0;
  app.innerHTML='<div class="view" id="v"></div>';
  ({home:vHome,learn:vLearn,topic:vTopic,cards:vCards,quiz:()=>vChoice('quiz'),listen:()=>vChoice('listen'),write:vWrite,result:vResult,dict:vDict,stats:vStats,settings:vSettings}[view])();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){goTab(t.dataset.tab);return}
});

/* ---------- pieces ---------- */
const head=(title,sub,back)=>`<div class="top">${back?'<button class="back" id="bk">←</button>':''}<div class="grow"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div></div>`;
const bindBack=()=>{const b=$('#bk');if(b)b.onclick=()=>window.__back()};
const bar=(f,cls='')=>`<div class="bar ${cls}"><i style="width:${Math.round(Math.max(0,Math.min(1,f))*100)}%"></i></div>`;
function startMode(m,s){if(s)sel=s;go(m,{})}
function confetti(){
  const em=['🎉','⭐','💖','✨','🌸','🍭'];
  for(let i=0;i<22;i++){const e=document.createElement('div');e.className='confetti';e.textContent=em[i%em.length];
    e.style.left=Math.random()*95+'%';e.style.animationDelay=Math.random()*.7+'s';e.style.fontSize=18+Math.random()*16+'px';
    document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}

/* ---------- session scaffold ---------- */
function sessionShell(title,ws){
  $('#v').innerHTML=head(title,esc(selName()),true)+`<div class="prog">${bar(0)}<span id="cnt"></span></div><div id="stage"></div>`;

/* ---------- CARDS ---------- */
function vCards(){
  const ws=pickWords();if(!ws.length)return empty();
  const sh=sessionShell('Kortelės',ws),st={i:0,ok:0,wrong:[]};
  (function draw(){
    clearTimers();
    if(st.i>=ws.length)return finish('cards',st.ok,ws.length,st.wrong);
    const w=ws[st.i];sh.set(st.i);
    $('#stage').innerHTML=`<div class="flip" id="fl"><div class="in">
      <div class="face f"><button class="fav" id="fv">${store.fav.has(w.en)?'⭐':'☆'}</button>
        <div class="big">${esc(w.en)}</div><button class="icon-btn" id="sp">🔊</button><div class="hint">Paliesk, kad apverstum</div></div>
      <div class="face b"><div class="big">${esc(w.ru)}</div>
        <div class="hint" style="margin-top:6px">${esc(w.en)}</div></div></div></div>
      <div id="ans" style="min-height:70px"></div>`;
    const fl=$('#fl');let flipped=false;
    later(200,()=>say(w.en));
    fl.onclick=e=>{
      if(e.target.closest('#fv')||e.target.closest('#sp'))return;
      if(flipped)return;flipped=true;fl.classList.add('on');
      $('#ans').innerHTML=`<div class="btnrow"><button class="btn danger" id="no">😕 Nežinau</button><button class="btn mint" id="yes">😊 Žinau!</button></div>`;
      const next=ok=>{store.record(w.en,ok);ok?st.ok++:st.wrong.push(w);st.i++;draw()};
      $('#no').onclick=()=>next(false);$('#yes').onclick=()=>next(true);
    };
    $('#sp').onclick=()=>say(w.en,true);
    $('#fv').onclick=()=>{store.toggleFav(w.en);$('#fv').textContent=store.fav.has(w.en)?'⭐':'☆'};
  })();
}

/* ---------- QUIZ / LISTEN ---------- */
function vChoice(mode){
  const ws=pickWords();if(!ws.length)return empty();
  const sh=sessionShell(mode==='quiz'?'Testas':'Klausymas',ws),st={i:0,ok:0,wrong:[]};
  (function show(){
    clearTimers();
    if(st.i>=ws.length)return finish(mode,st.ok,ws.length,st.wrong);
    const w=ws[st.i],i0=st.i;sh.set(i0);
    const toRu=mode==='listen'?true:Math.random()<.5;
    const correct=toRu?w.ru:w.en;
    const opts=shuffle([...distractors(w,toRu),correct]);
    let q;
    if(mode==='listen')q=`<div class="mut" style="font-weight:800;margin-bottom:10px">Išklausyk ir pasirink vertimą</div><button class="btn lav" id="rp" style="width:auto;padding:16px 28px;font-size:18px">🔊 Klausyti dar kartą</button>`;
    else q=`<div class="mut" style="font-weight:800;margin-bottom:6px">${toRu?'Pasirink vertimą':'Kaip tai lietuviškai?'}</div>
      <div class="big">${esc(toRu?w.en:w.ru)}</div>${toRu?`<button class="icon-btn" id="rp">🔊</button>`:''}`;
    $('#stage').innerHTML=`<div class="card qcard">${q}</div><div class="fb" id="fb"></div>
      ${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}<div id="nx"></div>`;
    if(mode==='listen'||toRu)later(250,()=>say(w.en));
    if($('#rp'))$('#rp').onclick=()=>say(w.en,true);
    let lock=false;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(lock)return;lock=true;
      const ok=opts[+b.dataset.k]===correct;store.record(w.en,ok);
      document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j]===correct)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
      if(ok){st.ok++;$('#fb').innerHTML='<span style="color:var(--mint)">✔ Teisingai! 🎉</span>'}
      else{st.wrong.push(w);vib(40);$('#fb').innerHTML=`<span style="color:var(--red)">✘ Teisingai: ${esc(correct)}</span>`}
      if(!(mode==='quiz'&&toRu))say(w.en);
      const adv=()=>{if(st.i===i0){st.i++;show()}};
      if(ok)later(1100,adv);
      else{$('#nx').innerHTML='<button class="btn" id="nb">Toliau →</button>';$('#nb').onclick=adv}
    });
  })();
}

/* ---------- WRITE ---------- */
function vWrite(){
  const ws=pickWords();if(!ws.length)return empty();
  const sh=sessionShell('Rašymas',ws),st={i:0,ok:0,wrong:[]};
  const norm=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^\p{L}0-9]/gu,'');
  (function show(){
    clearTimers();
    if(st.i>=ws.length)return finish('write',st.ok,ws.length,st.wrong);
    const w=ws[st.i],i0=st.i;sh.set(i0);let done=false,hints=0;
    $('#stage').innerHTML=`<div class="card qcard"><div class="mut" style="font-weight:800;margin-bottom:6px">Parašyk lietuviškai</div>
      <div class="big">${esc(w.ru)}</div><div class="hintline" id="hl"></div></div>
      <input class="in-text" id="in" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="…">
      <div class="fb" id="fb" style="margin-top:12px"></div>
      <div class="btnrow"><button class="btn soft" id="ht">💡 Užuomina</button><button class="btn ghost" id="sk">Praleisti</button><button class="btn" id="ck">Tikrinti</button></div>`;
    const inp=$('#in');setTimeout(()=>inp.focus(),150);
    const adv=()=>{if(st.i===i0){st.i++;show()}};
    const fin=ok=>{
      done=true;inp.blur();
      if(ok&&hints<2){st.ok++;store.record(w.en,true);inp.classList.add('ok');$('#fb').innerHTML=`<span style="color:var(--mint)">✔ Teisingai! [ ${esc(w.tr)} ]</span>`;later(1300,adv)}
      else{store.record(w.en,false);st.wrong.push(w);inp.classList.add('bad');vib(40);
        $('#fb').innerHTML=`<span style="color:var(--red)">${ok?'Atsakymas su užuominomis neįskaitomas. ':'✘ '}Teisingai: ${esc(w.en)}</span>`;
        $('#ck').textContent='Toliau →'}
      say(w.en);
    };
    $('#ht').onclick=()=>{
      if(done)return;hints++;let cnt=0,out='';
      for(const ch of w.en){
        if(ch===' ')out+='  ';
        else if(/[\p{L}0-9'’]/u.test(ch)){if(/[\p{L}0-9]/u.test(ch)){out+=cnt<hints?ch:'_';cnt++}else out+=ch}
        else out+=ch;
      }
      $('#hl').textContent=out.split('').join(' ');inp.focus();
    };
    const check=()=>{if(done)return adv();if(!inp.value.trim())return;fin(norm(inp.value)===norm(w.en))};
    $('#ck').onclick=check;
    $('#sk').onclick=()=>{done?adv():fin(false)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  })();
}

    if(confirm('Ištrinti visą pažangą ir mokymosi seriją?\nMėgstamiausi žodžiai bus išsaugoti.')){store.reset();render()}
  };
}

applyTheme();
render();
</script>
